version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: xpoz
    main: ./cmd/xpoz
    binary: xpoz
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: xpoz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    wrap_in_directory: false

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: scripts/sign.sh
    args:
      - ${artifact}
      - ${signature}
    signature: "${artifact}.sig"
    env:
      - SIGNING_KEY

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"

release:
  github:
    owner: AgusRdz
    name: xpoz
  draft: false
  generate_release_notes: false
