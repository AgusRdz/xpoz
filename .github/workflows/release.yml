name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # required for OIDC attestation
      attestations: write  # required for build provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for git-cliff changelog generation

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Make sign script executable
        run: chmod +x scripts/sign.sh

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/xpoz-*
